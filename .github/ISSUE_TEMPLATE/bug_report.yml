name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select pattern "..."
        2. Set ... to ...
        3. Export SVG
    validations:
      required: true
  - type: input
    id: processing-version
    attributes:
      label: Processing version
      placeholder: e.g. 4.5.7
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Preset, screenshots or console output
      description: Attach the preset JSON (Save preset...) or paste any errors from the Processing console.
